name: Android Build & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK components
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKM="$(find "$SDK" -name sdkmanager -type f | head -n 1)"
          fi
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          KS="$RUNNER_TEMP/release.keystore"
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KS"
            echo "RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v -keystore "$KS" -alias leakcheck -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass leakcheck123 -keypass leakcheck123 \
              -dname "CN=Johnny520, OU=leak-check, O=leak-check, L=City, ST=State, C=CN" >/dev/null 2>&1
            echo "RELEASE_STORE_PASSWORD=leakcheck123" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=leakcheck" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=leakcheck123" >> "$GITHUB_ENV"
            echo "::warning::未配置 KEYSTORE_BASE64 Secret，本次使用临时签名密钥，无法覆盖升级；请配置 Secrets 以获得固定签名。"
          fi
          echo "RELEASE_STORE_FILE=$KS" >> "$GITHUB_ENV"

      - name: Build release APK (R8 enabled)
        run: chmod +x gradlew && ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          VERSION=$(grep -oE 'versionName *= *"[^"]+"' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          cp app/build/outputs/apk/release/app-release.apk "out/leak-check-${VERSION}.apk"
          ls -la out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: leak-check-apk
          path: android/out/*.apk
          if-no-files-found: error

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/out/*.apk
          generate_release_notes: true
